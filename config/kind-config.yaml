# Конфигурация kind для стенда.
# Имя кластера передаётся через --name (CLUSTER_NAME в .env).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Фиксированный адрес и порт API, чтобы kubeconfig для Lens не менялся
  # между пересозданиями кластера. 127.0.0.1 из WSL пробрасывается в Windows.
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6550
nodes:
  - role: control-plane
    # kindest/node по умолчанию для kind v0.33.0
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # UI
      - { containerPort: 30080, hostPort: 8080, listenAddress: "127.0.0.1" } # Argo CD
      - { containerPort: 30081, hostPort: 8081, listenAddress: "127.0.0.1" } # Kargo
      # hello-api: dev / stage / prod
      - { containerPort: 30101, hostPort: 8101, listenAddress: "127.0.0.1" }
      - { containerPort: 30102, hostPort: 8102, listenAddress: "127.0.0.1" }
      - { containerPort: 30103, hostPort: 8103, listenAddress: "127.0.0.1" }
      # color-web: dev / stage / prod
      - { containerPort: 30111, hostPort: 8111, listenAddress: "127.0.0.1" }
      - { containerPort: 30112, hostPort: 8112, listenAddress: "127.0.0.1" }
      - { containerPort: 30113, hostPort: 8113, listenAddress: "127.0.0.1" }
