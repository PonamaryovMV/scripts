# Конфигурация kind для стенда. Имя кластера передаётся через --name.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Фиксированный адрес и порт API, чтобы kubeconfig для Lens не менялся между пересозданиями
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6550
nodes:
  - role: control-plane
    # kindest/node по умолчанию для kind v0.33.0
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # Вход на стенд: http://argocd, http://kargo, http://jenkins, http://qa-at-<сервис>-<окружение>
      # 127.0.0.1:80 → NodePort 30000 → Traefik → Ingress
      - { containerPort: 30000, hostPort: 80, listenAddress: "127.0.0.1" }
